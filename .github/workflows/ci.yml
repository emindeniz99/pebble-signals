# CI — the SDK-free PR bar (`pnpm run verify`: typecheck + tests at 100%
# coverage + consumer smoke), per CONTRIBUTING's verify chain.
#
# The SDK/emulator suites (test:xs, smoke:*, test:mem) are deliberately
# excluded — they need the Pebble tool + SDK 4.17 QEMU emulators (or xst),
# which CI runners do not have; the maintainer runs them before merge.
#
# pnpm/action-setup is given NO version input on purpose: it reads
# `"packageManager": "pnpm@11.10.0"` from the repo-root package.json.
name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
